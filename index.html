<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Under Development</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f14;
      color: #e8e8f0;
      font-family: 'Inter', sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .box {
      max-width: 500px;
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 3rem 2rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      color: #9a9aad;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .footer {
      margin-top: 1rem;
      padding-top: 1.5rem;
      border-top: 1px solid #2a2a3a;
      color: #9a9aad;
      font-size: 0.9rem;
    }
    .footer span { color: #ff4d6d; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🚧</div>
    <h1>This website is not available right now</h1>
    <p>Developing in process.<br>Thanks for patience.</p>
    <div class="footer">
      Made with <span>❤️</span> by Ravi Raj
    </div>
  </div>
</body>
</html>
